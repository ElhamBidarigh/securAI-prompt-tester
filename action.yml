name: "SecurAI Prompt Tester"
description: "Run 21 safe prompt injection attacks against an LLM app you own and send the findings to GitHub Code Scanning."
author: "Ellie Bidarigh"
branding:
  icon: shield
  color: blue

inputs:
  url:
    description: "Endpoint of the app to test, for example your staging chat API"
    required: true
  authorized:
    description: "Set to true to confirm you own this app or have written permission to test it. The action refuses to run otherwise."
    required: true
  fail-under:
    description: "Fail the job if the resistance score (0 to 100) is below this number. Use an empty value to never fail on score."
    required: false
    default: "70"
  headers:
    description: "Extra HTTP headers, one per line as 'Name: value'. Put secrets in repository secrets, for example 'Authorization: Bearer ${{ secrets.CHAT_TOKEN }}'."
    required: false
    default: ""
  body-template:
    description: 'JSON request body that contains {{prompt}}. Default: {"message": "{{prompt}}"}'
    required: false
    default: ""
  response-path:
    description: "Dotted path to the reply text in the JSON response. Auto-detected when empty."
    required: false
    default: ""
  system-marker:
    description: "A phrase from your real system prompt. Enables the system prompt leak tests."
    required: false
    default: ""
  repeat:
    description: "Send each attack this many times (models vary between runs)"
    required: false
    default: "1"
  sarif-location:
    description: "Repository file the alerts point at, ideally the file with your system prompt or chat handler"
    required: false
    default: "README.md"
  sarif-out:
    description: "Where to write the SARIF file"
    required: false
    default: "prompt-tester.sarif"
  upload-sarif:
    description: "Upload to GitHub Code Scanning. The calling job needs the permission security-events: write."
    required: false
    default: "true"
  python-version:
    description: "Python version used to run the tester"
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Check authorization
      shell: bash
      env:
        AUTHORIZED: ${{ inputs.authorized }}
      run: |
        if [ "$AUTHORIZED" != "true" ]; then
          echo "::error::Set authorized: true to confirm you own this app or have written permission to test it."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the tester
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Run the prompt injection tests
      id: scan
      shell: bash
      env:
        TARGET_URL: ${{ inputs.url }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        HEADERS: ${{ inputs.headers }}
        BODY_TEMPLATE: ${{ inputs.body-template }}
        RESPONSE_PATH: ${{ inputs.response-path }}
        SYSTEM_MARKER: ${{ inputs.system-marker }}
        REPEAT: ${{ inputs.repeat }}
        SARIF_LOCATION: ${{ inputs.sarif-location }}
        SARIF_OUT: ${{ inputs.sarif-out }}
      run: |
        report="$RUNNER_TEMP/prompt-tester-report.md"
        args=(scan --url "$TARGET_URL" --authorized --repeat "$REPEAT" --quiet
              --out "$report" --sarif-out "$SARIF_OUT" --sarif-location "$SARIF_LOCATION")
        if [ -n "$FAIL_UNDER" ]; then args+=(--fail-under "$FAIL_UNDER"); fi
        if [ -n "$RESPONSE_PATH" ]; then args+=(--response-path "$RESPONSE_PATH"); fi
        if [ -n "$SYSTEM_MARKER" ]; then args+=(--system-marker "$SYSTEM_MARKER"); fi
        if [ -n "$BODY_TEMPLATE" ]; then
          printf '%s' "$BODY_TEMPLATE" > "$RUNNER_TEMP/body-template.json"
          args+=(--body-template-file "$RUNNER_TEMP/body-template.json")
        fi
        while IFS= read -r line; do
          if [ -n "$line" ]; then args+=(--header "$line"); fi
        done <<< "$HEADERS"
        set +e
        python -m prompt_tester "${args[@]}"
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
        exit 0

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-out) != '' && (steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '1') }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-out }}
        category: securai-prompt-tester

    - name: Enforce the result
      if: ${{ always() }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: |
        code="${EXIT_CODE:-2}"
        if [ "$code" = "0" ]; then
          echo "Prompt injection check passed."
        elif [ "$code" = "1" ]; then
          echo "::error::The resistance score is below fail-under. See the job summary for details."
          exit 1
        elif [ "$code" = "3" ]; then
          echo "::error::Nothing could be tested. Check the url, headers and body template."
          exit 1
        else
          echo "::error::The check could not run (exit code $code)."
          exit 1
        fi
